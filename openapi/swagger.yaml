basePath: /api
definitions:
  main.CategoryInfo:
    description: Category information including hierarchy and post associations
    properties:
      children:
        example:
        - golang
        - javascript
        items:
          type: string
        type: array
      name:
        example: Tutorials
        type: string
      parent:
        example: tech
        type: string
      path:
        example: tech/tutorials
        type: string
      postCount:
        example: 2
        type: integer
      postSlugs:
        example:
        - getting-started-with-go
        - advanced-go-patterns
        items:
          type: string
        type: array
    type: object
  main.CategoryTreeNode:
    description: Hierarchical category tree node
    properties:
      children:
        items:
          $ref: '#/definitions/main.CategoryTreeNode'
        type: array
      name:
        example: Tutorials
        type: string
      path:
        example: tech/tutorials
        type: string
      postCount:
        example: 5
        type: integer
    type: object
  main.ErrorResponse:
    description: Error response format
    properties:
      error:
        example: Not found
        type: string
      message:
        example: The requested resource was not found
        type: string
    type: object
  main.FrontMatter:
    description: Post frontmatter containing metadata
    properties:
      author:
        example: John Doe
        type: string
      category:
        example: tech/tutorials
        type: string
      date:
        example: "2024-01-15"
        type: string
      excerpt:
        example: Learn the basics of Go programming language
        type: string
      slug:
        example: getting-started-with-go
        type: string
      tags:
        example:
        - golang
        - tutorial
        - beginner
        items:
          type: string
        type: array
      title:
        example: Getting Started with Go
        type: string
    type: object
  main.MetadataResponse:
    description: Unified API metadata including counts, pagination info, and configuration
    properties:
      categories:
        properties:
          perPage:
            example: 20
            type: integer
          stats:
            additionalProperties:
              type: integer
            type: object
          total:
            example: 8
            type: integer
          totalPages:
            example: 1
            type: integer
        type: object
      config:
        properties:
          dateFormat:
            example: "2006-01-02"
            type: string
          dateFormatReadable:
            example: yyyy-mm-dd
            type: string
        type: object
      posts:
        properties:
          newest:
            additionalProperties: true
            type: object
          oldest:
            additionalProperties: true
            type: object
          perPage:
            example: 10
            type: integer
          total:
            example: 42
            type: integer
          totalPages:
            example: 5
            type: integer
        type: object
      previews:
        properties:
          perPage:
            example: 10
            type: integer
          total:
            example: 42
            type: integer
          totalPages:
            example: 5
            type: integer
        type: object
      related:
        properties:
          perPage:
            example: 5
            type: integer
        type: object
      site:
        properties:
          description:
            example: My Site Description
            type: string
          name:
            example: My Site
            type: string
          tagline:
            example: My Site Tagline
            type: string
        type: object
      tags:
        properties:
          perPage:
            example: 20
            type: integer
          stats:
            additionalProperties:
              type: integer
            type: object
          total:
            example: 15
            type: integer
          totalPages:
            example: 1
            type: integer
        type: object
    type: object
  main.PaginatedResponse:
    description: Standard paginated list envelope
    properties:
      data: {}
      pagination:
        $ref: '#/definitions/main.PaginationInfo'
    type: object
  main.PaginationInfo:
    description: Pagination information for responses
    properties:
      hasNext:
        example: true
        type: boolean
      hasPrevious:
        example: false
        type: boolean
      nextPage:
        example: 1
        type: integer
      page:
        example: 0
        type: integer
      prevPage:
        example: 0
        type: integer
      totalItems:
        example: 42
        type: integer
      totalPages:
        example: 5
        type: integer
    type: object
  main.Post:
    description: Complete blog post including markdown content and frontmatter
    properties:
      excerpt:
        example: This is a brief excerpt of the post...
        type: string
      frontmatter:
        $ref: '#/definitions/main.FrontMatter'
      markdown:
        example: |-
          # Getting Started with Go

          This is the content...
        type: string
      readingTime:
        example: 5
        type: integer
    type: object
  main.PostPreview:
    description: Post preview containing frontmatter, excerpt, and reading time
    properties:
      excerpt:
        example: This is a brief excerpt of the post...
        type: string
      frontmatter:
        $ref: '#/definitions/main.FrontMatter'
      readingTime:
        example: 5
        type: integer
    type: object
  main.RelatedPost:
    description: Related post information with similarity metrics
    properties:
      commonTags:
        example: 3
        type: integer
      date:
        example: "2024-01-20"
        type: string
      readingTime:
        example: 8
        type: integer
      slug:
        example: advanced-go-patterns
        type: string
      title:
        example: Advanced Go Patterns
        type: string
    type: object
  main.SearchIndex:
    additionalProperties:
      items:
        type: string
      type: array
    description: Inverted search index mapping terms to post slugs for client-side
      search
    type: object
  main.SingleResponse:
    description: Standard single-item envelope
    properties:
      data: {}
    type: object
  main.TagInfo:
    description: Tag information
    properties:
      name:
        example: golang
        type: string
      postCount:
        example: 5
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: A static API for blogs that transforms markdown files with frontmatter
    into JSON endpoints
  title: Mantle API
  version: "1.0"
paths:
  /categories:
    get:
      description: Get paginated post previews for a specific category
      parameters:
      - description: Category path (e.g., tutorials/go)
        in: query
        name: category
        required: true
        type: string
      - default: 0
        description: Page number (0-indexed)
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Paginated previews for category
          schema:
            allOf:
            - $ref: '#/definitions/main.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/main.PostPreview'
                  type: array
                pagination:
                  $ref: '#/definitions/main.PaginationInfo'
              type: object
        "404":
          description: Category not found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Get posts by category
      tags:
      - categories
  /categories/tree.json:
    get:
      description: Get hierarchical category tree structure
      produces:
      - application/json
      responses:
        "200":
          description: Hierarchical category tree
          schema:
            allOf:
            - $ref: '#/definitions/main.SingleResponse'
            - properties:
                data:
                  description: Hierarchical category tree structure
                  items:
                    $ref: '#/definitions/main.CategoryTreeNode'
                  type: array
              type: object
      summary: Get category tree
      tags:
      - categories
  /meta.json:
    get:
      description: Get unified API metadata including counts, pagination info, and
        configuration
      produces:
      - application/json
      responses:
        "200":
          description: API metadata
          schema:
            $ref: '#/definitions/main.MetadataResponse'
      summary: Get API metadata
      tags:
      - metadata
  /posts/by-page:
    get:
      description: Get paginated posts with optional page parameter
      parameters:
      - default: 0
        description: Page number (0-indexed)
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Paginated posts
          schema:
            allOf:
            - $ref: '#/definitions/main.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/main.Post'
                  type: array
                pagination:
                  $ref: '#/definitions/main.PaginationInfo'
              type: object
        "404":
          description: Page not found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Get paginated posts
      tags:
      - posts
  /posts/by-slug:
    get:
      description: Get a specific post by its slug
      parameters:
      - description: Post slug
        in: query
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Single post
          schema:
            allOf:
            - $ref: '#/definitions/main.SingleResponse'
            - properties:
                data:
                  $ref: '#/definitions/main.Post'
              type: object
        "400":
          description: Missing slug parameter
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "404":
          description: Post not found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Get post by slug
      tags:
      - posts
  /previews/by-page:
    get:
      description: Get paginated post previews with optional page parameter
      parameters:
      - default: 0
        description: Page number (0-indexed)
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Paginated previews
          schema:
            allOf:
            - $ref: '#/definitions/main.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/main.PostPreview'
                  type: array
                pagination:
                  $ref: '#/definitions/main.PaginationInfo'
              type: object
        "404":
          description: Page not found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Get paginated previews
      tags:
      - previews
  /previews/by-slug:
    get:
      description: Get a specific post preview by its slug
      parameters:
      - description: Post slug
        in: query
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Single preview
          schema:
            allOf:
            - $ref: '#/definitions/main.SingleResponse'
            - properties:
                data:
                  $ref: '#/definitions/main.PostPreview'
              type: object
        "400":
          description: Missing slug parameter
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "404":
          description: Preview not found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Get preview by slug
      tags:
      - previews
  /related:
    get:
      description: Get related posts for a specific post by slug
      parameters:
      - description: Post slug
        in: query
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Related posts
          schema:
            allOf:
            - $ref: '#/definitions/main.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/main.RelatedPost'
                  type: array
                pagination:
                  $ref: '#/definitions/main.PaginationInfo'
              type: object
        "400":
          description: Missing slug parameter
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "404":
          description: Post not found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Get related posts
      tags:
      - related
  /search/index.json:
    get:
      description: Get inverted search index for client-side search
      produces:
      - application/json
      responses:
        "200":
          description: Search index
          schema:
            allOf:
            - $ref: '#/definitions/main.SingleResponse'
            - properties:
                data:
                  $ref: '#/definitions/main.SearchIndex'
              type: object
      summary: Get search index
      tags:
      - search
  /tags:
    get:
      description: Get paginated post previews for a specific tag
      parameters:
      - description: Tag name
        in: query
        name: tag
        required: true
        type: string
      - default: 0
        description: Page number (0-indexed)
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Paginated previews for tag
          schema:
            allOf:
            - $ref: '#/definitions/main.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/main.PostPreview'
                  type: array
                pagination:
                  $ref: '#/definitions/main.PaginationInfo'
              type: object
        "404":
          description: Tag not found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Get posts by tag
      tags:
      - tags
swagger: "2.0"
